<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabele HTML</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        table {
            border-collapse: collapse;
            font-size: 16px;
            text-align: center;
            background: white;
        }

        th, td {
            border: 1px solid #777;
            width: 50px;
            height: 50px;
            box-sizing: border-box;
            padding: 5px;
        }

        .bg-blue {
            background-color: #cae4f9;
            font-weight: bold;
            color: #333;
        }

        .bg-light-green {
            background-color: #eef5e7;
        }

        .bg-medium-green {
            background-color: #c5dcbe;
        }

        .bg-dark-green {
            background-color: #a3cc96;
        }

        /* Kolory dla inicjałów T i K */
        .bg-init-t {
            background-color: #ff9999;
            font-weight: bold;
        }

        .bg-init-k {
            background-color: #ffcc99;
            font-weight: bold;
        }
    </style>
</head>
<body>

    
    <table>
        <tr>
            <td class="bg-blue">1</td>
            <td class="bg-blue">2</td>
            <td class="bg-blue">3</td>
            <td class="bg-blue">4</td>
            <td class="bg-blue">5</td>
            <td class="bg-blue">6</td>
        </tr>
        <tr>
            <td class="bg-blue">2</td>
            <td>a</td>
            <td class="bg-light-green">b</td>
            <td class="bg-light-green">c</td>
            <td>d</td>
            <td>e</td>
        </tr>
        <tr>
            <td class="bg-blue">3</td>
            <td>f</td>
            <td>g</td>
            <td>h</td>
            <td>i</td>
            <td class="bg-medium-green">j</td>
        </tr>
        <tr>
            <td class="bg-blue">4</td>
            <td>k</td>
            <td>l</td>
            <td>m</td>
            <td>n</td>
            <td class="bg-medium-green">o</td>
        </tr>
        <tr>
            <td class="bg-blue">5</td>
            <td class="bg-dark-green">p</td>
            <td class="bg-dark-green">q</td>
            <td class="bg-dark-green">r</td>
            <td>s</td>
            <td>t</td>
        </tr>
        <tr>
            <td class="bg-blue">6</td>
            <td class="bg-dark-green">u</td>
            <td class="bg-dark-green">v</td>
            <td class="bg-dark-green">w</td>
            <td>y</td>
            <td>z</td>
        </tr>
    </table>

    
    <table>
        <tr>
            <td class="bg-blue">1</td>
            <td class="bg-blue">2</td>
            <td class="bg-blue">3</td>
            <td class="bg-blue">4</td>
            <td class="bg-blue">5</td>
            <td class="bg-blue">6</td>
        </tr>
        <tr>
            <td class="bg-blue">2</td>
            <td>a</td>
            <td colspan="2" class="bg-light-green">b, c</td>
            <td>d</td>
            <td>e</td>
        </tr>
        <tr>
            <td class="bg-blue">3</td>
            <td>f</td>
            <td>g</td>
            <td>h</td>
            <td>i</td>
            <td rowspan="2" class="bg-medium-green">j, o</td>
        </tr>
        <tr>
            <td class="bg-blue">4</td>
            <td>k</td>
            <td>l</td>
            <td>m</td>
            <td>n</td>
        </tr>
        <tr>
            <td class="bg-blue">5</td>
            <td colspan="3" rowspan="2" class="bg-dark-green">p, q, r, u, v, w</td>
            <td>s</td>
            <td>t</td>
        </tr>
        <tr>
            <td class="bg-blue">6</td>
            <td>y</td>
            <td>z</td>
        </tr>
    </table>

    
    <table>
        <tr>
            <td class="bg-blue">1</td>
            <td class="bg-blue">2</td>
            <td class="bg-blue">3</td>
            <td class="bg-blue">4</td>
            <td class="bg-blue">5</td>
            <td class="bg-blue">6</td>
        </tr>
        <tr>
            <td class="bg-blue">2</td>
            <td>a</td>
            <td class="bg-light-green">b</td>
            <td class="bg-light-green">c</td>
            <td>d</td>
            <td>e</td>
        </tr>
        <tr>
            <td class="bg-blue">3</td>
            <td>f</td>
            <td>g</td>
            <td>h</td>
            <td>i</td>
            <td class="bg-medium-green">j</td>

        </tr>
        <tr>
            <td class="bg-blue">4</td>
            <td colspan="5" rowspan="2">k,l,m,n,o,p,r,s,t</td>
        </tr>
        <tr>
            <td class="bg-blue">5</td>
        </tr>
        <tr>
            <td class="bg-blue">6</td>
            <td class="bg-dark-green">u</td>
            <td class="bg-dark-green">v</td>
            <td class="bg-dark-green">w</td>
            <td>y</td>
            <td>z</td>
        </tr>
    </table>

</body>
</html>
